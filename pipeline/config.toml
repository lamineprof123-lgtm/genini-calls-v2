# Gemini Signals configuration. SIGNALS ONLY: this project never places orders.

# t255u SHARED RESET: one token for every account (main Lucid, exit books, bracket, Carbon, Claude, C-OPUS-B,
# DS-FLASH, every OTHER-VENUE sub-account). The loop stamps state/reset.json with the exact time; the clean panel
# (signals/panel.py -> panel.json) shows performance and positions since then. Signal scorer data is separate.
[reset]
token = "2026-11-12-uniform-reset"
reason = "reset all accounts to 100k after the last model change was made (t255u)"

[panel]
enabled = true
poll_seconds = 15

[general]
symbols = ["XAUUSD", "EURUSD", "GBPUSD", "US100", "XAGUSD", "BTCUSD"]
timeframe_minutes = 15
candles = 120            # closed candles shown/analysed per symbol
warmup_candles = 60      # extra history fetched so ATR/EMA are warmed up (not drawn)
session_tz = "Asia/Dubai" # trading-day boundary for the circuit breaker and log folders
logs_dir = "logs"
state_dir = "state"

[chart]
width = 1280
height = 720
background = "#0E1117"
text_color = "#C9D1D9"
visible_candles = 100    # exactly N visible candles, fixed bar spacing (clamped to 80..120)
volume_pane_pct = 11     # low-opacity volume histogram height, % of canvas (10-12); price pane margins follow it
bull_color = "#26A69A"   # body + wick
bear_color = "#EF5350"   # body + wick
template = "chart_v2.html"  # live: EMA50 + RVOL + warm Playwright pool / bar cache

[chart.ema50]
length = 50
color = "#9CA3AF"         # 1px dashed structural baseline (chart_v2 only)
width = 1

[chart.rvol]
length = 20               # average-volume lookback
threshold = 2.0           # RVOL > this -> spike color on volume bars (chart_v2)
spike_color = "#FACC15"
normal_color = "#374151"

[chart.volume_profile]
# Session Volume Profile (POC / VAH / VAL). Session = same anchor as VWAP per symbol
# (utc_day for FX/gold/BTC; cme_globex 18:00 ET for US100).
# Value Area is the contiguous 70% of session volume expanding from the POC bin.
# Dukascopy FX/gold/index volume is tick volume; Binance BTC is exchange volume.
price_bins = 50
value_area_pct = 0.70

[chart.cvd]
# Approximate Cumulative Delta from OHLCV (Dukascopy = tick volume). Same session anchor as VWAP/VP.
# Flat bars (high==low) contribute 0 delta (no /0.0001 hack).
# Label NEUTRAL when |CVD| < neutral_pct * session_volume.
neutral_pct = 0.05
slope_bars = 4               # cvd_slope = sum of last N per-bar deltas

[chart.session]
# Institutional windows in America/New_York (half-open). Computed from the SIGNAL BAR time
# (last closed candle), not wall clock — required for replay correctness.
# Flaw fixed vs naive snippet: LONDON 03-08 / OVERLAP 08-11 / NEW_YORK 11-16 are distinct
# (the old 03-11 branch shadowed NEW_YORK forever).
london   = ["03:00", "08:00"]   # LONDON_SESSION
overlap  = ["08:00", "11:00"]   # LONDON_NY_OVERLAP
new_york = ["11:00", "16:00"]   # NEW_YORK_SESSION
asian    = ["18:00", "02:00"]   # ASIAN_SESSION_CHOP (wraps midnight); else LOW_LIQUIDITY_DEADZONE
# Lucid paper sim hard-blocks new entries in these (existing positions still managed).
blocked_for_automation = ["ASIAN_SESSION_CHOP", "LOW_LIQUIDITY_DEADZONE"]

[chart.vwap]
# Session-anchored VWAP, offset 0, no deviation bands.
# Default anchor: 00:00 UTC (FX, gold, BTC). Per-symbol override via [symbols.X].vwap_anchor:
#   "utc_day" = reset 00:00 UTC; "cme_globex" = reset 18:00 America/New_York (CME futures session open, used for US100)
default_anchor = "utc_day"
color = "#FF9800"
width = 3

[chart.atr_channel]
ema_length = 20
atr_length = 14
mult = 2.0
baseline_color = "#4B5563"   # 1px dashed
upper_color = "#00E676"      # 1px solid
lower_color = "#FF1744"      # 1px solid
fill_color = "#64B5F6"
fill_opacity = 0.08          # fill between bands (custom series primitive)

[chart.sr]
pivot_lookback = 12          # bars each side for pivot highs/lows (10-15)
rolling_hours = 24           # rolling 24h high/low
dedupe_atr = 0.35            # merge levels closer than N x ATR (higher-priority label wins)
max_per_side = 3
resistance_color = "#E91E63"
support_color = "#7C4DFF"
line_width = 2               # Lightweight Charts only supports integer widths (1.5 -> 2)
line_style = "dashed"        # "dashed" | "dotted"

[gemini]
# Entry scans (batched 2-min / M15 call covering all eligible charts) use `model`.
# 18-second exit checks (exit manager, both books + Lucid) use `exit_model`.
# Override with GEMINI_ENTRY_MODEL / GEMINI_EXIT_MODEL.
# Legacy GEMINI_MODEL is ignored when GEMINI_ENTRY_MODEL is set (workflow pins entry to 3.8-flash
# and no longer exports GEMINI_MODEL, so it cannot silently revert entry to 3.6-flash).
# On retryable errors (429/5xx/UNAVAILABLE) the SAME model is retried with backoff.
# A 404 / unknown ID is not retried and is not silently replaced by another model.
# History: gemini-2.0-flash shut down 2026-06-01; gemini-2.5-flash returns 404 "no longer available to new users".
model = "gemini-3.8-flash"            # 15-min / batched entry scans (ALWAYS kept on)
exit_model = "gemini-3.8-flash"       # 18s exit checks (used only when exit_calls are enabled)
fallback_models = []                  # entry: no cross-model fallback
exit_fallback_models = []             # exit: no cross-model fallback
thinking_level = "low"                # exit-manager Gemini calls (currently paused); leave low
entry_thinking_level = "high"         # flash 2-min entry scans only (t244u); tagged on each signal
temperature = 0.2                     # sent ONLY to pre-3.x models (3.6+ deprecate sampling params)
timeout_seconds = 110                 # per entry request; raised for thinking=high + XAGUSD/BTCUSD charts, inside 2-min cadence
max_attempts_per_model = 2
retry_budget_seconds = 115            # per model, incl. request time (one high-thinking call + slim retry under 2 min)
backoff_base_seconds = 1.5
backoff_max_seconds = 5.0

[risk]
min_rr = 0.0               # server-side scalp SL/TP (see [scalp]); Gemini = direction+confidence only. Was 2.5.
min_confidence = 0.55      # 0..1; below this the signal is downgraded to HOLD
max_entry_distance_atr = 1.0  # entry must be within N x ATR of the last close
min_stop_distance_atr = 0.25  # reject stops tighter than N x ATR (noise)
default_risk_pct = 0.5     # % of equity risked per signal when the model gives none
max_risk_pct = 1.0
max_daily_loss_pct = 3.5   # circuit breaker: > this % loss vs start-of-day equity => HOLD all, halt for the session

[equity]
provider = "paper_file"    # "paper_file" | "mt5"
paper_file = "state/paper_equity.json"
paper_start_equity = 100000.0

[scheduler]
interval_minutes = 2       # GitHub Actions in-job loop default (env SIGNALS_INTERVAL_MINUTES overrides). Was 5.
# user schedule: a signal every 5 min (blueprint said 10; 15 aligns to M15 closes)
align_offset_seconds = 20  # wait N s after the boundary so the closed candle is published
skip_if_no_new_candle = false  # testing: call Gemini every cycle (set true for production)

[data]
default_chain = ["dukascopy", "yfinance"]

# Per-symbol provider chain + provider-specific tickers. First provider that returns enough candles wins.
[symbols.XAUUSD]
name = "GOLD"            # asset label shown on the signal page
chain = ["dukascopy", "yfinance"]
dukascopy = "xauusd"
yfinance = "GC=F"          # proxy: COMEX gold futures (not spot)
mt5 = "XAUUSD"
contract_size = 100        # units per 1.0 lot (broker-specific)
digits = 2

[symbols.EURUSD]
name = "EURO"            # asset label shown on the signal page
chain = ["dukascopy", "yfinance"]
dukascopy = "eurusd"
yfinance = "EURUSD=X"
mt5 = "EURUSD"
contract_size = 100000
digits = 5

[symbols.GBPUSD]
name = "POUND"            # asset label shown on the signal page
chain = ["dukascopy", "yfinance"]
dukascopy = "gbpusd"
yfinance = "GBPUSD=X"
mt5 = "GBPUSD"
contract_size = 100000
digits = 5

[symbols.US100]
name = "NASDAQ"            # asset label shown on the signal page
chain = ["dukascopy", "yfinance"]
dukascopy = "usatechidxusd" # Dukascopy USA Tech 100 CFD (Nasdaq-100)
vwap_anchor = "cme_globex"  # reset 18:00 New York (futures session open)
yfinance = "NQ=F"           # proxy: E-mini Nasdaq-100 futures
mt5 = "US100"
contract_size = 1
digits = 2

[symbols.XAGUSD]
name = "SILVER"          # asset label shown on the signal page
chain = ["dukascopy", "yfinance"]
dukascopy = "xagusd"
yfinance = "SI=F"          # proxy: COMEX silver futures (not spot)
mt5 = "XAGUSD"
contract_size = 5000       # COMEX SI = 5,000 troy oz
digits = 3

[symbols.BTCUSD]
name = "BITCOIN"            # asset label shown on the signal page
chain = ["binance", "dukascopy", "yfinance"]
binance = "BTCUSDT"         # proxy: Binance spot BTC/USDT (real exchange volume)
dukascopy = "btcusd"
yfinance = "BTC-USD"
mt5 = "BTCUSD"
contract_size = 1
digits = 2

[live_price]
# Intrabar live price + forming M15 candle (signals/live_price.py). Indicators stay on CLOSED M15 bars only.
# Order: US100 in NY RTH -> FirmTape NQ + basis; else Dukascopy ticks (bid, seconds old); else Dukascopy/Binance
# last finished M1 (1-2 min old); else last M15 close (stale).
ticks = true
tick_lookback_minutes = 20
tick_timeout_seconds = 15

[live_price.firmtape]
# US100 live price = FirmTape 1-second NQ + rolling median basis to the Dukascopy CFD scale.
# Key: env FIRMTAPE_API_KEY only. Gate: NY regular hours, session "open", age_s <= max_age_s, no error,
# NQ price_as_of <= live_max_age_s old, at least one aligned basis sample. Otherwise Dukascopy ticks.
enabled = true
url = "https://firmtape.com/api/v1/levels"
timeout_seconds = 4
symbols = { US100 = "NQ" }
rth_et = ["09:30", "16:00"]
max_age_s = 300
live_max_age_s = 10
basis_align_s = 20              # a basis sample needs the Dukascopy tick ts and NQ price_as_of within N s
basis_window = 7                # rolling median of the last N aligned samples ...
basis_max_age_minutes = 30      # ... no older than this

[site]
# Static one-page signal site (index.html + JSON). The loop writes status.json and latest_signal.json here.
# Pure static: publish this folder as-is (e.g. GitHub Pages). Contains no secrets.
dir = "site"

[publish]
# Push site/status.json + site/latest_signal.json to the GitHub Pages repo after every loop event (non-blocking).
enabled = false                 # GitHub Actions loop (signals/gha_loop.py) commits + deploys instead
repo_dir = ""
branch = "main"
author_name = "lamineprof123-lgtm"
author_email = "lamineprof123-lgtm@users.noreply.github.com"
max_retries = 3


# ---------------------------------------------------------------------------------------------------------------
# Dynamic scalp stop / take-profit (signals/scalp_levels.py). Server-side source of truth for public site + Lucid.
# Gemini supplies direction + confidence + rationale; stop/target are overwritten every cycle.
# Thesis: high directional accuracy, quick 1-3 bar momentum scalps, tight/negative R:R, size to clear NET $ floor.
[scalp]
enabled = true
atr_stop_mult = 0.8             # ATR leg of the stop (Wilder ATR14 on M15)
structure_buffer_atr = 0.05     # buffer beyond signal-candle high/low
min_stop_atr = 0.25             # never tighter than this (noise floor)
time_cut_candles = 2            # exit if no MFE within N x 15m candles (default 30 min)
mfe_min_atr = 0.25              # "moved in favor" = MFE >= this x ATR (scalp targets)
# Extended targets (target_source extended:* / structure:next:*): 4x15m and MFE >= min(0.25xATR, 1/3 x planned target)
mfe_min_target_frac = 0.3333
time_cut_candles_extended = 4
vwap_cross_exit = true          # 15m close back across VWAP against the position -> market exit
ema50_cross_exit = true         # 15m close back across EMA50 against the position -> market exit
tp_before_level_ticks = 1       # take profit just before the next structural wall

# Fixed tactical targets = midpoint of the user ranges (indices 15-25 ticks, FX/gold 10-15 pips)
[scalp.fixed_target]
US100  = { ticks = 20, tick_size = 0.25 }       # 5.0 index points
XAUUSD = { pips = 12.5, pip_size = 0.10 }       # 1.25 gold
EURUSD = { pips = 12.5, pip_size = 0.0001 }     # 12.5 FX pips
GBPUSD = { pips = 12.5, pip_size = 0.0001 }
XAGUSD = { pips = 12.5, pip_size = 0.01 }        # 0.125 silver
BTCUSD = { ticks = 20, tick_size = 5.0 }         # public site + OTHER-VENUE CFD

# ---------------------------------------------------------------------------------------------------------------
# Lucid Trading LucidPro 100K PAPER simulator (signals/lucid.py). PAPER ONLY: nothing is ever sent to a broker.
# Rules source: Lucid help center as summarised 2026-11-09 (attachment "Lucid Trading - 100K account rules & fees").
# Prices come from the spot/CFD proxy feed (Dukascopy M1), not real CME futures quotes (basis/spread ignored).
[lucid]
enabled = true
plan = "LucidPro 100K (DLL on)"
# One-shot reset: when this token differs from the one stored in state/lucid/account.json, the sim archives the
# state (account_pre_reset_<day>.json), starts a fresh account and logs a "reset" event. Logs are kept.
reset_token = "2026-11-12-uniform-reset"     # t255u shared reset: every account fresh $100k after the last model change
reset_reason = "t255u: reset all accounts to $100k after the last model change (uniform 1 ATR bracket)"
reset_archive = "account_pre_reset_2026-11-12-uniform-reset.json"
exit_books_archive = "exit_books_pre_reset_2026-11-12-uniform-reset.json"
# USER RULE (2026-11-11): "take the entry signal and the exit signal". exit_mode = "gemini": Gemini's entry opens,
# the exit manager's Gemini CLOSE (book gemini_exit_book, checks every [exit_manager].check_seconds) closes.
# No server target, no 2-bar time cut, no VWAP/EMA50 cross exits, no $381 NET-target floor (there is no target).
# Safety rails kept: hard stop (structure / 0.8 ATR, sized so risk <= max_risk_usd), DLL/MLL, 3.5% breaker
# (exit books), 16:45 ET flat, max_hold_minutes. exit_mode = "server" restores the old target/time-cut sim.
# USER RULE (2026-11-11 23:00 Dubai): "100% Gemini decision. Remove the hard stop, no stop loss no tp".
# exit_mode = "gemini_only": entry = Gemini signal, exit = Gemini CLOSE only (1-strike for the account; books A/B).
# No stop, no target, no max hold, no 16:45 flat, no forced exit. DLL / MLL / 3.5% breaker are LOG-ONLY.
# Size = full-size 1..6 as if risk were 0.8 ATR at max_risk_usd (notional reference only), capped at the LucidPro 100K max of 6 minis.
exit_mode = "gemini_only"
gemini_exit_book = "1-strike"
# USER RULE (2026-11-12 ~15:55 Dubai): "apply the best stop you can think of, for max profit and low loss".
# Hard stop at -$500 NET of round-trip commission on the main account + the 1-strike / 2-strike books (best variant
# in the 22-trade replay: -$4,521 vs -$8,302 actual, worst loss -$715). Trigger: live price at every 18 s exit
# check or the M1 path since the last scan. Fill = resting stop: the level + slippage_ticks (bar open / live price
# if it gapped through, e.g. already beyond when armed at deploy or after a data/session gap). Exit reason
# "hard_stop_500". Gemini still makes every other close. Positions open at deploy are armed from deploy time.
# After a stop-out the symbol re-enters the entry scan (main behaves like a real stop). The [exit_manager]
# shadow book "nostop" copies every entry and exits on Gemini CLOSE only (never stopped). 0 / unset = no stop.
hard_stop_net_usd = 500.0
max_hold_minutes = 90
start_balance = 100000.0
eval_profit_target = 6000.0
mll = 3000.0                    # EOD trailing on highest closing balance
initial_trail_balance = 103100.0
locked_mll_balance = 100100.0   # floor locks here once an EOD close exceeds initial_trail_balance
mll_intraday_binding = true     # conservative: intraday equity <= MLL floor blows the account (Lucid unconfirmed)
dll_fixed = 1800.0              # soft: flatten + no more trades until next session
lucidscale_pct = 0.60           # funded: after an EOD close above initial trail, DLL = 60% x peak EOD profit (never decreases)
# USER RULE (2026-11-11): FULL-SIZE futures only (NQ, GC, 6E, 6B), never micros.
# Cap matches the real LucidPro 100K aggregate: 6 minis (or 60 micros; we do not trade micros).
max_minis = 6                   # LucidPro 100K aggregate full-size contracts across open positions
flat_by_et = "16:45"            # forced flat Mon-Fri (America/New_York)
session_open_et = "18:00"       # reopen Sun-Thu
no_new_entries_last_minutes = 15
# fees (third-party card reads, NOT checkout-verified)
eval_fee = 190.40               # VAULT code price, DLL on
reset_fee = 190.0               # charged when an eval is blown (a blown funded account buys a new eval at eval_fee)
# funded payouts
funded_consistency = 0.40       # largest single day <= 40% of cycle profit
min_cycle_profit = 750.0
payout_buffer = 103100.0        # balance after payout must stay >= this
min_payout = 500.0
max_payout_first = 2500.0
max_payout_later = 3000.0       # inferred from "$106,100 min balance for max payout"
trader_split = 0.90
# --- strategy: dynamic scalp SL/TP (see [scalp]); size to clear NET $ floor ---
# target_usd_aim/min/max are NET of round-trip commission (entry+exit). size_trade skips if net < min.
# USER UPDATE 2026-11-09: minimum per trade is $381 NET (was $500).
target_usd_aim = 750.0          # preferred NET target per trade (after RT commission)
target_usd_min = 381.0          # minimum NET target; skip trade if net would be below this
target_usd_max = 1000.0         # max NET target
stop_to_target_ratio = 2.0      # legacy fallback only; live path uses [scalp] structure/ATR stop
max_risk_usd = 1500.0           # hard cap on a single stop-out (always < DLL)
min_risk_usd = 381.0            # skip if remaining DLL room cannot cover at least the net floor
target_atr_mult = 0.6           # legacy; live path uses [scalp] fixed/structural target
# If the scalp target (fixed / nearest structure) cannot clear target_usd_min at a size inside max_risk_usd and
# max_minis, extend it: next structure level beyond it, else the distance giving ~target_usd_aim NET with the fewest
# contracts that fit the risk cap (else the max fitting size at the cap, if >= target_usd_min). Never beyond this:
extend_max_target_atr = 1.0
min_target_atr = 0.10           # reject absurdly tight targets (noise)
max_target_atr = 3.0            # reject absurdly wide targets
min_stop_atr = 0.25             # floor used by [scalp] (was 0.6 loose-stop era)
respect_mll_room = false        # false = a stop may exceed the room above the MLL floor (accept blow-ups; user's style)
dll_safety_usd = 50.0           # keep (open risk + new stop) under remaining DLL minus this
min_confidence = 0.55
max_entry_distance_atr = 1.0    # Gemini entry must be within N x ATR of the last M15 close
entry_mode = "market"           # "market": fill at/after the minute after the signal; "limit": wait for Gemini's entry price
# FILL PRICE (2026-11-12 fix, no rule change): market entries fill at the LIVE quote read at fill time from the
# same path as the 18 s exit checks and the hard stop (live_price.enrich_live_prices: Dukascopy tick BID, US100
# in NY RTH FirmTape NQ + basis), + slippage_ticks, entry_time = quote fetch time. The old fill used the M1 bar
# open of the fill minute, or (when the closed-M1 feed lagged) the LAST FINISHED M1 CLOSE, 1-2 min stale:
# gold shorts on 12 Nov were booked $200-480 better / $640 worse than market. No usable quote (M1/last-close
# fallback, stale, older than fill_quote_max_age_s) = no fill yet: the pending retries every 18 s until it expires.
entry_fill = "live_quote"
fill_quote_sources = ["dukascopy:tick", "firmtape:NQ"]
fill_quote_max_age_s = 60
max_chase_atr = 0.5             # market mode: skip if the fill is > N x ATR worse than Gemini's entry
pending_expiry_minutes = 10
slippage_ticks = 1              # adverse ticks on market entries and stop / forced exits
correlated_groups = [["6E", "6B"]]  # no opposite-direction positions inside a group (anti-hedge)
fresh_signal_max_age_minutes = 10

[lucid.contracts]               # CME specs: point value $ per 1.0 price unit; commissions per side (Lucid list)
# FULL-SIZE ONLY (user rule): no micro contracts are defined; any spec marked micro = true is refused.
NQ  = { point_value = 20.0,     tick = 0.25,    commission = 1.75 }
GC  = { point_value = 100.0,    tick = 0.10,    commission = 2.30 }
6E  = { point_value = 125000.0, tick = 0.00005, commission = 2.40 }
6B  = { point_value = 62500.0,  tick = 0.0001,  commission = 2.40 }
# COMEX SI (t253u): 5,000 oz, $5,000 per $1, tick $0.005 = $25; Lucid commission $2.30/side
# (fees file 2026-11-09: GC/SI/HG/PL group). Counts toward the 6-mini cap. Full-size only (no SIL).
SI  = { point_value = 5000.0,   tick = 0.005,   commission = 2.30 }

[lucid.symbols]                 # signal symbol -> candidate Lucid contracts (BTCUSD is OTHER-VENUE, not Lucid)
US100  = { contracts = ["NQ"],        m1 = "usatechidxusd" }
XAUUSD = { contracts = ["GC"],        m1 = "xauusd" }
EURUSD = { contracts = ["6E"],        m1 = "eurusd" }
GBPUSD = { contracts = ["6B"],        m1 = "gbpusd" }
XAGUSD = { contracts = ["SI"],        m1 = "xagusd" }

# ---------------------------------------------------------------------------------------------------------------
# Gemini EXIT MANAGER (signals/exit_manager.py). PAPER ONLY. Two extra paper books copy every Lucid sim entry
# (same contract / qty / entry / hard stop) and let Gemini manage the exit on the SAME M15 chart as the entry
# model (+ ENTRY line). One Gemini call per open position per check, shared by both books:
#   book A "1-strike": first CLOSE exits.
#   book B "2-strike": while MFE < runner_mfe_atr, two consecutive CLOSEs exit (~36 s); once MFE >= runner_mfe_atr,
#                      a single CLOSE exits.
# When gemini_exit_calls_enabled is false, model CLOSE calls are not made. Main + 1-strike keep the -$500 net
# hard stop and add a 1 ATR target + 90-min cap; nostop uses 1 ATR stop / 1 ATR target / 90-min cap. Bracket and
# CB-BRACKET are unchanged. CB-RUNNER keeps its mechanical stop/lock/trail/target/150-min cap and drops Carbon
# exit-model checks. New closes are tagged exit_prompt_version=mech-exit-v1. Claude Haiku exits are unchanged.
[exit_manager]
enabled = true
# USER RULE (2026-11-12 t247u): ONE uniform exit for every book — 1 ATR stop / 1 ATR target / 90-min cap.
# Replaces the -$500 net hard stop on main/1-strike and CB-RUNNER's lock/trail/2.5 ATR / 150-min cap.
# No model exit calls (Gemini flag stays false; Claude Haiku exits also paused). Reversible.
# Open positions are armed from now (no account reset). New closes tagged exit_mode=uniform-1atr-v1.
uniform_1atr_exits = true
gemini_exit_calls_enabled = false
mech_target_atr = 1.0
mech_time_cap_minutes = 90
mech_nostop_stop_atr = 1.0         # kept as alias; under uniform every book uses 1 ATR stop
check_seconds = 18              # exit check cadence while any book position is open (runs beside the 2-min loop)
runner_mfe_atr = 0.8            # MFE (in M15 ATR14 at entry) where rule 2 "milk the expansion" starts / 2-strike off
wall_reject_atr = 0.10          # "within 0.10 ATR of the target wall"
giveback_pct = 35.0             # profit-protection giveback threshold (after MFE >= giveback_min_mfe_atr)
giveback_min_mfe_atr = 1.0
early_minutes = 12              # "underwater in the first N minutes -> hold on wicks/rejections"
max_hold_minutes = 90           # safety: force exit after N minutes (no fixed TP / time cut in these books)
max_daily_loss_pct = 3.5        # per-book circuit breaker vs book start-of-day balance (Dubai day)
start_balance = 100000.0
gemini_timeout_seconds = 12     # per exit call; on error/timeout the decision is HOLD (logged)
max_feed_age_minutes = 20       # ignore Lucid entries older than this when first seen (e.g. after a deploy)
# nostop = shadow book: identical entries, exits ONLY on Gemini CLOSE (1-strike rule), never hard-stopped. It keeps
# getting Gemini exit checks after the main position was stopped, until Gemini closes it. Added mid-run it starts
# as a copy of the 1-strike book (balance, stats, open positions: all pre-stop trades were no-stop).
# USER RULE (2026-11-12 ~17:45 Dubai, t210u): the 2-strike book is KILLED (it alone was costing ~18% of all Gemini
# exit calls: it keeps a position open after the 1-strike/nostop books closed on the first CLOSE). Removed from
# this list -> retired at the next loop start: state archived to state/exit_books_retired_2-strike_<ts>.json and
# exit_books.json["retired_books"]; logs kept. No exit checks, no Gemini calls, not on the panel.
books = ["1-strike", "nostop"]
shadow_books = ["nostop"]
hard_stop_gap_seconds = 180     # live stop trigger: fill at the level (resting stop) if the stop was working <= this long ago, else at the live price (gap)

# ---------------------------------------------------------------------------------------------------------------
# FirmTape options-gamma (GEX) levels + 1-second NQ price (signals/firmtape.py). Key: env FIRMTAPE_API_KEY only.
# US100 -> NQ (additive basis to the Dukascopy CFD scale), XAUUSD -> GLD (ratio scale); FX / BTC: gex = null.
# Gate: NY RTH 09:30-16:00 ET, session == "open", no error, age_s <= max_age_s; else gex = null, no chart lines.
# FirmTape returns errors as HTTP 200 (top-level "error" or levels[i].error). Units differ per symbol: only the
# SIGN of net_gamma is used. Raw FirmTape prices never reach the chart or Gemini (always basis/ratio adjusted).
[firmtape]
enabled = true
url = "https://firmtape.com/api/v1/levels"
timeout_seconds = 4
symbols = { US100 = "NQ", XAUUSD = "GLD" }
rth_et = ["09:30", "16:00"]
max_age_s = 300                 # levels older than this -> gex = null
min_cache_seconds = 3           # one request shared by the entry cycle and the 18 s exit checks
max_cache_seconds = 60          # cache TTL = next_update_s clamped to [min, max]
error_cache_seconds = 10        # back-off after a failed request
walls_per_side = 2
chart_margin_pct = 15           # draw GEX lines only within the visible candle range +/- this % of its height
# US100 live price (NQ + rolling basis) is set by [live_price.firmtape] / signals/firmtape_live.py; GEX reuses its
# basis and its FirmTape response (one shared request per cycle).

# ---------------------------------------------------------------------------------------------------------------
# CLAUDE PARALLEL PAPER SIMS (signals/claude_sim.py, claude_rules.py, claude_client.py). PAPER ONLY.
# Per templates/claude/claude_wiring_handoff.md: two $100k Lucid-style accounts identical except the entry model.
#   C-OPUS entries claude-opus-5-5, C-SONNET entries claude-sonnet-5-5; both exit with claude-haiku-5-5.
# Same charts + numbers as Gemini; one batched entry call per model per M15 close; exit call every 18 s per open
# position per sim. Server rules are BINDING here (hard stop, $900 sizing, BE / profit-lock floors, 45-min time stop,
# daily -$1,500, trailing $300 buffer, re-entry lock, USD-group cap, 0.3 ATR fill check, one entry per cycle).
# Phase A (never +0.25 ATR): model CLOSE is ignored; server exits on a closed M15 after entry beyond
# invalidation or wrong-side of both VWAP and EMA20, plus hard stop and 45-min time stop.
# Phases B/C keep first-M15-close grace (close_ignored_grace). Confidence is logged, never acted on.
# Entry scan is its own task at M15 close +20s (does not wait for the Gemini cycle).
# Closed trades are tagged exit_prompt_version=v3 (earlier closes keep v2-grace / v2-pre-grace).
# The Gemini sim is unchanged (control); Gemini closes are tagged gemini-profit-lock-reset6 only.
# Key: env ANTHROPIC_API_KEY only (repo secret). Missing key -> sims idle, panel shows "waiting for key".
# Env overrides: CLAUDE_ENTRY_MODELS (comma list), CLAUDE_EXIT_MODEL.
[claude]
enabled = true
entry_models = ["claude-opus-5-5", "claude-sonnet-5-5"]   # one sim per entry model
exit_model   = "claude-haiku-5-5"
exit_calls_enabled = false           # t247u: pause Haiku (and shadow/what-if exit) API calls; reversible
entry_effort = "medium"
exit_effort  = "low"
timeout_seconds_entry = 60
timeout_seconds_exit  = 5
max_attempts = 2
entry_max_tokens = 8000
exit_max_tokens = 200
check_seconds = 18
start_balance = 100000.0
reset_token = "2026-11-12-uniform-reset"       # was claude-v2-1; change to start both Claude accounts fresh (old state archived)
skip_blocked_sessions = true      # no entry call when all 4 symbols are in ASIAN_SESSION_CHOP / DEADZONE (prompt HOLDs)
m5_chart = true                   # Claude exit image is an M5 chart (same style as entry); falls back to M15 if M1 is missing
scan_offset_seconds = 20          # own entry task at M15 close +20s; Gemini loop is not delayed
recent_trades = 15

[claude.sims]
claude-opus-5-5   = ["C-OPUS", "Claude Opus"]
claude-sonnet-5-5 = ["C-SONNET", "Claude Sonnet"]

[claude.rules]                    # handoff section 3 (binding)
stop_min_atr = 0.6
stop_max_atr = 1.5
risk_usd = 900.0
account_max_contracts = 6
fx_group_max = 4                  # 6E + 6B on the same side share 4 contracts
be_trigger_atr = 0.5
lock1_trigger_atr = 1.0
lock1_pct = 0.50
lock2_trigger_atr = 1.5
lock2_pct = 0.60
time_stop_minutes = 90               # t247u: uniform 90-min cap (was 45-min / 0.25 ATR gate)
time_stop_mfe_atr = 0.0              # cap always fires at 90 min (no MFE gate)
daily_loss_usd = 1500.0
trail_buffer_usd = 300.0
loss_lock_minutes = 30
fill_max_adverse_atr = 0.3        # skip fill if live quote is worse than chart_live_price by more than this
group_lock_minutes = 30           # after a hard stop, lock that USD group
exit_fail_limit = 3
stale_price_seconds = 60
max_chase_atr = 0.5
min_score = 5
slippage_ticks = 1
max_qty = { NQ = 1, GC = 1, SI = 1, 6E = 4, 6B = 4 }

# ---------------------------------------------------------------------------------------------------------------
# 'bracket' GEMINI SHADOW BOOK (signals/bracket.py). PAPER ONLY, its own $100k account. Main account rules unchanged.
# From gemini-signals/analysis/edge_study.md (12 Nov 2026): the same live Gemini entry signals as main (no extra
# Gemini call), confidence >= 0.75, XAUUSD / EURUSD / US100 only (no GBPUSD, no BTC); fixed bracket at entry:
# stop 1 M15 ATR, target 1 ATR, 90-min max hold, flat by 21:45 UTC; Gemini CLOSEs ignored. Fill = live quote
# (same feed as the hard stop) + 1 tick; every exit 1 tick slippage; real commission. Half of Lucid sizing:
# qty = floor(risk_usd / (1 ATR x point value)) >= 1, max 6 full-size open in this book, one per symbol.
# Tracked independently of main (takes a signal even while main holds the symbol). Limitation: main's entry scan
# drops symbols MAIN holds, so there is no signal for them that cycle (counted as missed_scans in bracket.json).
[bracket]
enabled = true
symbols = ["XAUUSD", "EURUSD", "US100", "XAGUSD"]  # BTCUSD is OTHER-VENUE (MAIN copy)
min_confidence = 0.75
stop_atr = 1.0
target_atr = 1.0
max_hold_minutes = 90
flat_utc = "21:45"
reopen_utc = "23:00"
no_new_entries_last_minutes = 15
risk_usd = 900.0                # half of Lucid: 1-ATR stop risks ~$750-900 (1 contract minimum)
max_risk_usd = 1500.0           # skip if ONE contract at the 1-ATR stop would risk more than this
max_minis = 6
slippage_ticks = 1
start_balance = 100000.0
check_seconds = 18
pending_expiry_seconds = 180    # no usable live quote for this long -> the signal is dropped
max_chase_atr = 0.5
fill_quote_max_age_s = 60
gap_seconds = 180
reset_token = "2026-11-12-uniform-reset"   # was bracket-v1

# ---------------------------------------------------------------------------------------------------------------
# GEMINI 4 CARBON SIDE BOOKS CB-BRACKET / CB-RUNNER (signals/carbon.py). PAPER ONLY, each its own $100k account.
# Source: the "Blue Bird: Gemini 4 Carbon side books" playbook (user t221u/t222u, 12 Nov 2026). Separate asyncio
# tasks (own M15-close+20 s scan, own triggered checks, own 18 s server exits); separate state (state/carbon/),
# logs (logs/<day>/carbon_*.jsonl) and site file (carbon.json). Main / 1-strike / nostop / bracket / Claude untouched.
# Entries: gemini-4-carbon, thinking_level high (t244u; was medium), the live entry prompt + SignalBatch schema
# unchanged, 150 s timeout (raised from 90 s for high thinking + a 4th chart), one attempt, no fallback.
# Symbols: XAUUSD / EURUSD / US100 are tradeable in CB-BRACKET / CB-RUNNER. XAGUSD (t253u, Lucid SI) and BTCUSD (t254u, OTHER-VENUE) are included in every
# M15+20 s scan and in triggered checks, but is scored what-if only (1 BTC unit, both exit styles) — the books
# never open a BTC position (not a Lucid contract). Flagged "site-only/what-if" on the panel.
# Risk rules below are BINDING in these two books only. Spend caps unchanged ($15 soft / $19 hard).
[carbon_books]
enabled = true
model = "gemini-4-carbon"
entry_thinking = "high"              # M15 scans + triggered checks (t244u)
exit_thinking = "low"                # CB-RUNNER model exits (currently paused)
symbols = ["XAUUSD", "EURUSD", "US100", "XAGUSD", "BTCUSD"]
tradeable_symbols = ["XAUUSD", "EURUSD", "US100", "XAGUSD"]   # Lucid books may open these; BTCUSD is OTHER-VENUE
entry_window_utc = ["08:00", "20:30"]
flat_utc = "21:45"
scan = "m15_close_plus_20s"
scan_offset_seconds = 20
timeout_seconds = 300                # thinking=high with 24k output: 18:00Z close took 175 s (14.3k thought tokens); 180 s hit 504 DEADLINE on a trigger. One attempt, no fallback
min_confidence = 0.75
max_chase_atr = 0.5
start_balance = 100000.0
check_seconds = 18
slippage_ticks = 1
reset_token = "2026-11-12-uniform-reset"        # was carbon-v1; change to start both Carbon accounts fresh (old state archived)

[carbon_books.triggered_checks]
level_cross_atr = 0.1
bar_range_atr = 1.5
rvol_gt = 2.0
max_per_symbol_per_bar = 1
max_per_day = 40
poll_seconds = 30                # how often the code-side triggers are evaluated (no Carbon call unless one fires)

[carbon_books.sizing]
risk_usd = 900
atr_mult = 1.0
min_contracts = 1
skip_if_one_contract_risk_gt = 1200
caps = { US100 = 1, XAUUSD = 1, XAGUSD = 1, EURUSD = 4 }
aggregate_max = 6

# BTCUSD has no Lucid contract. What-if only: 1 unit = 1 BTC, $1 per $1, tick 5 (same as the public site scalp tick).
# CB-BRACKET / CB-RUNNER must never open this symbol.
[carbon_books.whatif_units.BTCUSD]
tick = 5.0
point_value = 1.0
commission = 0.0
unit = "1 BTC"
flag = "site-only/what-if"

[carbon_books.books.CB-BRACKET]
stop_atr = 1.0
target_atr = 1.0
max_hold_min = 90
model_exits = false

[carbon_books.books.CB-RUNNER]
# t247u: same 1 ATR / 1 ATR / 90-min bracket as every other book (trail / 2.5 ATR / 150 min retired).
stop_atr = 1.0
target_atr = 1.0
max_hold_min = 90
model_exits = false
lock_at_atr = 1.0                  # unused while uniform exits are on (kept for a flag flip)
lock_to_atr = 0.5
trail_atr = 0.75

[carbon_books.risk]
daily_stop_usd = -1500
mll_buffer_usd = 300
one_per_symbol = true
reentry_lock = "next_m15_close"
after_loss_lock_min = 30
mll_usd = 3000.0                 # Lucid EOD trailing loss limit used for the trailing guard
locked_mll_balance = 100100.0

[carbon_books.spend_cap]
soft_usd = 15
hard_usd = 19
price_per_mtok = { "until_2026-11-30" = [2, 10], "from_2026-12-01" = [4, 20] }
max_output_tokens = { entry = 24000, exit = 800 }   # thinking=high used 5997 thought tokens and hit MAX_TOKENS at 6000 (t255 fix)


