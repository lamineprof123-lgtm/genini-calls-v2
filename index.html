<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1117">
<title>Project Blue Bird</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #0E1117; --fg: #E6EDF3; --muted: #7D8590; --faint: #4B535E; --line: #1C2129; --card: #121722;
    --buy: #26A69A; --sell: #EF5350; --amber: #F5A524;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { min-height: 100dvh; padding: 24px 20px 32px; }
  header { display: flex; justify-content: space-between; align-items: center; font-size: 12px;
           letter-spacing: .22em; text-transform: uppercase; color: var(--muted); max-width: 1240px; margin: 0 auto; }
  .brand { display: inline-flex; align-items: center; line-height: 0; text-decoration: none; }
  .brand img { height: 56px; width: auto; display: block; }
  @media (min-width: 900px) { .brand img { height: 68px; } }
  .state { display: inline-flex; align-items: center; gap: 8px; letter-spacing: .16em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--buy); }
  .state.paused .dot { background: var(--amber); } .state.paused { color: var(--amber); }
  .state.live .dot { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .eyebrow { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
  .count { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 300;
           font-size: clamp(64px, 18vw, 128px); line-height: 1; letter-spacing: -.04em; margin: 14px 0 10px;
           background: linear-gradient(100deg, #7DD3FC 0%, #00B4FF 18%, #22D3EE 36%, #00E676 55%, #00B4FF 72%, #7DD3FC 88%, #00E676 100%);
           background-size: 220% 100%; -webkit-background-clip: text; background-clip: text;
           color: transparent; -webkit-text-fill-color: transparent;
           filter: drop-shadow(0 0 10px rgba(0,180,255,.28)) drop-shadow(0 0 22px rgba(0,230,118,.16));
           animation: countGlow 7.5s ease-in-out infinite; }
  @keyframes countGlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  @media (prefers-reduced-motion: reduce) { .count { animation: none; background-position: 40% 50%; } }
  .sub { font-size: 13px; color: var(--muted); }
  .wrap { max-width: 1240px; margin: 18px auto 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 14px; margin-bottom: 18px; }
  .card h2 { font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
             display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .card h2 small { font-weight: 400; letter-spacing: .04em; text-transform: none; color: var(--faint); }
  .banner { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 18px; text-align: center; }
  .banner b { color: var(--fg); font-weight: 600; }
  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 8px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { font-family: var(--sans); font-weight: 500; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); border-top: 0; }
  td.l, th.l { text-align: left; }
  td.book { font-family: var(--sans); color: var(--fg); }
  tr.model td { font-family: var(--sans); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
                padding-top: 14px; border-top: 1px solid #262c36; }
  tr.ov td { color: var(--muted); }
  tr.ov td.book { color: var(--muted); padding-left: 22px; }
  .pos { color: var(--buy); } .neg { color: var(--sell); } .dim { color: var(--faint); }
  .st { font-family: var(--sans); font-size: 10.5px; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .st.OPEN { color: #7DD3FC; border-color: rgba(125,211,252,.35); }
  .st.stop { color: var(--sell); border-color: rgba(239,83,80,.35); }
  .st.target { color: var(--buy); border-color: rgba(38,166,154,.4); }
  .st.time { color: var(--amber); border-color: rgba(245,165,36,.35); }
  .side.LONG { color: var(--buy); } .side.SHORT { color: var(--sell); }
  .empty { color: var(--faint); font-size: 13px; padding: 14px 4px; font-family: var(--sans); }
  .note { margin-top: 10px; font-size: 11px; color: var(--faint); line-height: 1.5; }
  .cards { display: none; }
  .mc { border-top: 1px solid var(--line); padding: 11px 2px; }
  .mc:first-child { border-top: 0; }
  .mc-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .mc-t { font-size: 15px; font-weight: 600; color: var(--fg); }
  .mc-t .side { font-size: 13px; margin-left: 6px; }
  .mc-s { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; overflow-wrap: anywhere; }
  .mc-g { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 10px; margin-top: 9px; }
  .mc-k { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .mc-v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--fg); margin-top: 1px; overflow-wrap: anywhere; }
  .mc-v.pos { color: var(--buy); } .mc-v.neg { color: var(--sell); }
  .mg { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 16px 0 4px; }
  .mg:first-child { margin-top: 0; }
  @media (max-width: 699px) {
    body { padding: 16px 12px 24px; }
    .brand img { height: 44px; }
      .count { font-size: clamp(56px, 20vw, 88px); }
    .card { padding: 14px 12px 10px; border-radius: 14px; }
    .tw { display: none; }
    .cards { display: block; }
    .banner { font-size: 12px; text-align: left; overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="./" aria-label="Project Blue Bird"><img src="logo-bluebird.png" alt="Project Blue Bird" width="82" height="68"></a>
  <div class="state" id="state"><span class="dot"></span><span id="stateText">—</span></div>
</header>


<div class="wrap">
  <div class="banner" id="banner">Loading…</div>

  <section class="card" aria-label="Performance since reset">
    <h2><span>Performance since reset</span><small id="perfUpd"></small></h2>
    <div class="tw"><table id="perf"></table></div>
    <div class="cards" id="perfCards"></div>
  </section>

  <section class="card" aria-label="Positions since reset">
    <h2><span>Every position since reset</span><small id="posCount"></small></h2>
    <div class="tw"><table id="pos"></table></div>
    <div class="cards" id="posCards"></div>
    <div class="note" id="posNote"></div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TZ = 'Asia/Dubai', TZL = 'Dubai';
  const OFFLINE_AFTER_S = 1800;
  let status = null, panel = null;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const usd = (v, sign = true) => v == null ? '—' : (sign && v > 0 ? '+' : (v < 0 ? '−' : '')) + '$' +
    Math.abs(Number(v)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const bal = v => v == null ? '—' : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const cls = v => v > 0 ? 'pos' : (v < 0 ? 'neg' : '');
  const fmt = (iso, opt) => { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString('en-GB', { timeZone: TZ, hour12: false, ...opt }); };
  const hm = iso => fmt(iso, { hour: '2-digit', minute: '2-digit' });
  const dhm = iso => fmt(iso, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  const dhms = iso => fmt(iso, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const mmss = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const px = v => v == null ? '—' : Number(v).toLocaleString('en-US', { maximumFractionDigits: 5 });
  const qty = v => v == null ? '—' : (Number(v) % 1 ? Number(v).toFixed(3) : String(v));

  async function getJSON(path) {
    try { const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' }); return r.ok ? await r.json() : null; }
    catch { return null; }
  }
  const newer = (a, b) => !b || !(Date.parse(a.updated_at) < Date.parse(b.updated_at));

  // ---- live / paused dot (status.json); no countdown ----
  function renderClock() {
    const now = Date.now();
    let m = 'live';
    if (!status || status.state === 'paused' || status.state === 'stopped') m = 'paused';
    else if (isNaN(Date.parse(status.updated_at)) || now - Date.parse(status.updated_at) > OFFLINE_AFTER_S * 1000) m = 'offline';
    $('state').className = 'state ' + (m === 'live' ? 'live' : 'paused');
    $('stateText').textContent = m === 'live' ? 'Live' : (m === 'offline' ? 'Offline' : 'Paused');
  }

  // ---- panel.json ----
  const MODEL_NAME = { 'gemini-3.8-flash': 'Gemini 3.8 Flash', 'gemini-4-carbon': 'Gemini 4 Carbon',
    'claude-opus-5-5': 'Claude Opus', 'claude-sonnet-5-5': 'Claude Sonnet', 'deepseek-flash': 'DeepSeek Flash' };
  function renderPanel() {
    const P = panel; if (!P) return;
    const r = P.reset || {};
    $('banner').innerHTML = `Paper only · all accounts reset to <b>$100,000</b> at <b>${esc(dhms(r.at))} ${TZL}</b>` +
      ` (token <b>${esc(r.token || '—')}</b>) · ${esc(P.exit_rule || '')}`;
    $('perfUpd').textContent = `updated ${hm(P.updated_at)} ${TZL}`;
    // performance: grouped by model, one Lucid line + one Other-venue line per book
    const wpfVal = (x) => {
      if (x.went_positive_first_label) return x.went_positive_first_label;
      const v = x.went_positive_first;
      return v === 'yes' ? 'Yes' : v === 'no' ? 'No' : v === '?' ? '?' : '—';
    };
    const wpfCls = v => v === 'Yes' ? 'pos' : (v === 'No' ? 'neg' : 'dim');
    let h = `<tr><th class="l">Book</th><th class="l">Venue</th><th>Balance</th><th>Net P&amp;L</th><th>Open P&amp;L</th>
      <th>Closed</th><th>W / L</th><th>Win rate</th><th>Went positive first</th><th>Open</th></tr>`;
    let lastModel = null;
    for (const p of P.performance || []) {
      if (p.model !== lastModel) { lastModel = p.model; h += `<tr class="model"><td class="l" colspan="10">${esc(MODEL_NAME[p.model] || p.model)}</td></tr>`; }
      const ov = p.venue !== 'LUCID';
      h += `<tr class="${ov ? 'ov' : ''}"><td class="l book">${ov ? '↳ ' : ''}${esc(p.book)}</td>
        <td class="l">${ov ? 'Other venue (BTC)' : 'Lucid'}</td>
        <td>${bal(p.balance)}</td><td class="${cls(p.net_pnl_usd)}">${usd(p.net_pnl_usd)}</td>
        <td class="${cls(p.open_pnl_usd)}">${p.open_positions ? usd(p.open_pnl_usd) : '—'}</td>
        <td>${p.trades}</td><td>${p.wins} / ${p.losses}</td>
        <td>${p.win_rate == null ? '—' : (100 * p.win_rate).toFixed(0) + '%'}</td>
        <td>${p.went_positive_first == null ? '—' : esc(p.went_positive_first)}</td><td>${p.open_positions}</td></tr>`;
    }
    $('perf').innerHTML = h;
    const kv = (k, v, c = '') => `<div><div class="mc-k">${k}</div><div class="mc-v ${c}">${v}</div></div>`;
    let pc = '', lm = null;
    const perfs = P.performance || [];
    for (const p of perfs.filter(q => q.venue === 'LUCID')) {
      if (p.model !== lm) { lm = p.model; pc += `<div class="mg">${esc(MODEL_NAME[p.model] || p.model)}</div>`; }
      const o = perfs.find(q => q.book === p.book && q.venue !== 'LUCID');
      pc += `<div class="mc"><div class="mc-h"><span class="mc-t">${esc(p.book)}</span>
        <span class="mc-s">${p.open_positions + (o ? o.open_positions : 0)} open</span></div>
        <div class="mc-s">${esc(p.label || '')}</div>
        <div class="mc-g">${kv('Balance', bal(p.balance))}${kv('Net P&amp;L', usd(p.net_pnl_usd), cls(p.net_pnl_usd))}
        ${kv('Open P&amp;L', p.open_positions ? usd(p.open_pnl_usd) : '—', cls(p.open_pnl_usd))}
        ${kv('Closed', p.trades)}${kv('W / L', p.wins + ' / ' + p.losses)}
        ${kv('Win rate', p.win_rate == null ? '—' : (100 * p.win_rate).toFixed(0) + '%')}
        ${kv('Went positive first', p.went_positive_first == null ? '—' : esc(p.went_positive_first))}</div>
        ${o ? `<div class="mc-s" style="margin-top:8px">Other venue (BTC): ${bal(o.balance)} · net <span class="${cls(o.net_pnl_usd)}">${usd(o.net_pnl_usd)}</span>
          · ${o.trades} closed (${o.wins}/${o.losses})${o.open_positions ? ` · ${o.open_positions} open <span class="${cls(o.open_pnl_usd)}">${usd(o.open_pnl_usd)}</span>` : ''}
          · went positive first ${o.went_positive_first == null ? '—' : esc(o.went_positive_first)}</div>` : ''}</div>`;
    }
    $('perfCards').innerHTML = pc;
    // positions
    const rows = P.positions || [];
    $('posCount').textContent = `${rows.length} position${rows.length === 1 ? '' : 's'} · ${rows.filter(x => x.status === 'OPEN').length} open`;
    if (!rows.length) {
      $('pos').innerHTML = `<tr><td class="empty l">No positions since the reset yet.</td></tr>`;
      $('posCards').innerHTML = `<div class="empty">No positions since the reset yet.</div>`;
    } else {
      let t = `<tr><th class="l">Book</th><th class="l">Model</th><th class="l">Symbol</th><th class="l">Side</th><th>Size</th>
        <th class="l">Entry (${TZL})</th><th>Entry px</th><th>Max $ P&amp;L</th><th>Lowest $ P&amp;L</th>
        <th class="l">Went positive first</th><th class="l">Status</th>
        <th>Now / exit px</th><th>P&amp;L at close</th></tr>`;
      for (const x of rows) {
        const st = x.status || 'OPEN', k = st === 'OPEN' ? 'OPEN' : st.replace('CLOSED-', '');
        const label = st === 'OPEN' ? 'OPEN' : st;
        const book = x.venue === 'LUCID' ? x.book : `${x.book} · other venue`;
        t += `<tr><td class="l book">${esc(book)}</td><td class="l dim">${esc(MODEL_NAME[x.model] || x.model || '')}</td>
          <td class="l">${esc(x.symbol)}${x.contract ? ` <span class="dim">${esc(x.contract)}</span>` : ''}</td>
          <td class="l side ${esc(x.side)}">${esc(x.side)}</td><td>${qty(x.qty)}</td>
          <td class="l">${esc(dhm(x.entry_time))}</td><td>${px(x.entry)}</td>
          <td class="${cls(x.max_pnl_usd)}">${usd(x.max_pnl_usd)}</td><td class="${cls(x.min_pnl_usd)}">${usd(x.min_pnl_usd)}</td>
          <td class="l ${wpfCls(wpfVal(x))}">${esc(wpfVal(x))}</td>
          <td class="l"><span class="st ${esc(k)}">${esc(label)}</span>${st === 'OPEN' && x.last_pnl_usd != null ? ` <span class="${cls(x.last_pnl_usd)}">${usd(x.last_pnl_usd)}</span>` : ''}</td>
          <td>${st === 'OPEN' ? px(x.last_price) : px(x.exit)}</td>
          <td class="${cls(x.net_at_close_usd)}">${st === 'OPEN' ? '—' : usd(x.net_at_close_usd)}</td></tr>`;
      }
      $('pos').innerHTML = t;
      const kv = (k, v, c = '') => `<div><div class="mc-k">${k}</div><div class="mc-v ${c}">${v}</div></div>`;
      $('posCards').innerHTML = rows.map(x => {
        const st = x.status || 'OPEN', k = st === 'OPEN' ? 'OPEN' : st.replace('CLOSED-', '');
        return `<div class="mc"><div class="mc-h"><span class="mc-t">${esc(x.symbol)}<span class="side ${esc(x.side)}">${esc(x.side)} ${qty(x.qty)}</span></span>
          <span class="st ${esc(k)}">${esc(st)}</span></div>
          <div class="mc-s">${esc(x.book)}${x.venue === 'LUCID' ? '' : ' · other venue'} · ${esc(MODEL_NAME[x.model] || x.model || '')}${x.contract ? ' · ' + esc(x.contract) : ''}</div>
          <div class="mc-g">${kv('Entry ' + TZL, esc(dhm(x.entry_time)))}${kv('Entry px', px(x.entry))}
          ${kv(st === 'OPEN' ? 'Now' : 'Exit px', st === 'OPEN' ? px(x.last_price) : px(x.exit))}
          ${kv('Max $', usd(x.max_pnl_usd), cls(x.max_pnl_usd))}${kv('Lowest $', usd(x.min_pnl_usd), cls(x.min_pnl_usd))}
          ${kv('Went positive first', esc(wpfVal(x)), wpfCls(wpfVal(x)))}
          ${st === 'OPEN' ? kv('Open P&amp;L', usd(x.last_pnl_usd), cls(x.last_pnl_usd)) : kv('Close P&amp;L', usd(x.net_at_close_usd), cls(x.net_at_close_usd))}</div></div>`;
      }).join('');
    }
    $('posNote').textContent = (P.pnl_note || '') + ' Status: OPEN, or CLOSED-stop / CLOSED-target / CLOSED-time by the mechanical 1 ATR bracket.';
  }

  async function pollStatus() { const s = await getJSON('status.json'); if (s && newer(s, status)) status = s; }
  async function pollPanel() { const p = await getJSON('panel.json'); if (p && newer(p, panel)) { panel = p; renderPanel(); } }
  pollStatus(); pollPanel();
  setInterval(pollStatus, 5000);
  setInterval(pollPanel, 10000);
  setInterval(renderClock, 1000);
})();
</script>
</body>
</html>
