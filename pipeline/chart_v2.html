<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>gemini-signals chart v2</title>
<script src="static/lightweight-charts.standalone.production.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0E1117; overflow: hidden; }
  #capture { position: relative; width: 1280px; height: 720px; background: #0E1117;
             font-family: "DejaVu Sans", Arial, sans-serif; }
  #chart { position: absolute; inset: 0; }
  #hdr { position: absolute; top: 8px; left: 12px; z-index: 10; color: #e6e6e6; pointer-events: none; }
  #hdr .sym { font-size: 22px; font-weight: 700; }
  #hdr .meta { font-size: 12px; color: #9aa4b2; margin-top: 2px; max-width: 1100px;
               white-space: pre-wrap; line-height: 1.35; word-break: break-word; }
  #legend { position: absolute; top: 10px; right: 90px; z-index: 10; font-size: 12px; color: #c9d1d9;
            background: rgba(14,17,23,0.8); padding: 4px 8px; border-radius: 4px; }
  .sw { display: inline-block; width: 16px; height: 0; vertical-align: middle; margin: 0 4px 0 10px; }
</style>
</head>
<body>
<div id="capture">
  <div id="chart"></div>
  <div id="hdr"><div class="sym" id="sym">-</div><div class="meta" id="meta"></div></div>
  <div id="legend"></div>
</div>
<script>
class BandFill {
  constructor(upper, lower, color) { this._u = upper; this._l = lower; this._color = color; this._pts = []; }
  attached({ chart, series, requestUpdate }) { this._chart = chart; this._series = series; requestUpdate(); }
  detached() {}
  updateAllViews() {
    const ts = this._chart.timeScale(), s = this._series, lo = new Map(this._l.map(p => [p.time, p.value]));
    this._pts = this._u.filter(p => lo.has(p.time)).map(p => ({
      x: ts.timeToCoordinate(p.time), yu: s.priceToCoordinate(p.value), yl: s.priceToCoordinate(lo.get(p.time)) }))
      .filter(p => p.x !== null && p.yu !== null && p.yl !== null);
  }
  setBands(upper, lower) { this._u = upper; this._l = lower; }
  paneViews() {
    const self = this;
    return [{ zOrder: () => 'bottom', renderer: () => ({ draw(target) {
      target.useBitmapCoordinateSpace(({ context: ctx, horizontalPixelRatio: hr, verticalPixelRatio: vr }) => {
        const P = self._pts; if (P.length < 2) return;
        ctx.beginPath();
        P.forEach((p, i) => i ? ctx.lineTo(p.x * hr, p.yu * vr) : ctx.moveTo(p.x * hr, p.yu * vr));
        for (let i = P.length - 1; i >= 0; i--) ctx.lineTo(P[i].x * hr, P[i].yl * vr);
        ctx.closePath(); ctx.fillStyle = self._color; ctx.fill();
      });
    } }) }];
  }
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

window.__rendered = false;
window.__renderSeq = 0;
window.__chartState = null;

function _markRendered(fast) {
  // double-rAF is enough once the chart exists; first paint keeps a short settle for BandFill
  const settle = fast ? 0 : 40;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (settle) setTimeout(() => { window.__rendered = true; }, settle);
    else window.__rendered = true;
  }));
}

function _applyMeta(p) {
  const S = p.style, V = S.vwap, A = S.atr_channel, R = S.sr, E50 = S.ema50 || {};
  const prec = Math.max(0, Math.min(8, p.digits));
  const n = p.candles.length, last = p.candles[n - 1], c = p.context || {};
  document.getElementById('sym').textContent = p.symbol + '  ·  ' + p.timeframe;
  const cvdTxt = c.cvd_header || (
      (typeof c.cvd === 'number')
        ? `CVD ${(c.cvd >= 0 ? '+' : '')}${Math.abs(c.cvd) >= 100 ? Math.round(c.cvd).toLocaleString('en-US') : Number(c.cvd).toFixed(2)} (${c.cvd_label || 'NEUTRAL'})`
        : null);
  const sessTxt = c.session ? `SESSION ${c.session}` : null;
  // Deliberate 2-line header so CVD/SESSION never split mid-token
  const line1 = `src ${p.source}:${p.ticker}  |  close ${last.close.toFixed(prec)}  |  VWAP ${(c.vwap ?? NaN).toFixed(prec)} (${c.vwap_anchor})`
    + `  |  EMA50 ${(c.ema50 ?? NaN).toFixed(prec)}  |  ATR14 ${(c.atr ?? NaN).toFixed(prec)}`
    + `  |  POC ${(c.poc ?? NaN).toFixed(prec)}  |  VAH ${(c.vah ?? NaN).toFixed(prec)}  |  VAL ${(c.val ?? NaN).toFixed(prec)}`;
  const line2 = [cvdTxt, sessTxt,
    `last bar ${new Date(last.time * 1000).toISOString().slice(0,16).replace('T',' ')} UTC`]
    .filter(Boolean).join('  |  ');
  document.getElementById('meta').textContent = line1 + '\n' + line2;
  const sw = (col, style, h) => `<span class="sw" style="border-top:${h}px ${style} ${col}"></span>`;
  document.getElementById('legend').innerHTML =
    sw(V.color || '#FF9800', 'solid', 2) + 'VWAP'
    + sw(E50.color || '#9CA3AF', 'dashed', 1) + 'EMA50'
    + sw(A.baseline_color, 'dashed', 1) + 'EMA20'
    + sw(A.upper_color, 'solid', 1) + '+2 ATR'
    + sw(A.lower_color, 'solid', 1) + '-2 ATR'
    + sw(R.resistance_color, 'dashed', 2) + 'Resistance'
    + sw(R.support_color, 'dashed', 2) + 'Support'
    + sw('#FACC15', 'solid', 3) + 'RVOL&gt;2';
}

function _setAllData(st, p) {
  st.vol.setData(p.volume.map(v => ({
    time: v.time, value: v.value,
    color: v.color || (v.rvol > 2 ? '#FACC15' : '#374151')
  })));
  st.base.setData(p.mid);
  st.up.setData(p.upper);
  st.lo.setData(p.lower);
  if (st.fill) st.fill.setBands(p.upper, p.lower);
  if (st.e50 && p.ema50) st.e50.setData(p.ema50);
  st.vw.setData(p.vwap);
  st.cs.setData(p.candles);
  // refresh S/R price lines
  (st.priceLines || []).forEach(pl => { try { st.cs.removePriceLine(pl); } catch (e) {} });
  st.priceLines = [];
  const R = p.style.sr;
  const ls = R.line_style === 'dotted' ? LightweightCharts.LineStyle.Dotted : LightweightCharts.LineStyle.Dashed;
  (p.levels || []).forEach(lv => {
    st.priceLines.push(st.cs.createPriceLine({
      price: lv.price, color: lv.type === 'resistance' ? R.resistance_color : R.support_color,
      lineWidth: Math.round(R.line_width), lineStyle: ls, axisLabelVisible: true, title: lv.label
    }));
  });
  const n = p.candles.length, vis = Math.max(80, Math.min(120, p.visible || 100));
  st.chart.timeScale().setVisibleLogicalRange({ from: n - vis - 0.5, to: n - 0.5 });
}

window.renderChart = function (p) {
  window.__rendered = false;
  window.__renderSeq = (window.__renderSeq || 0) + 1;
  // tear down previous chart if any (warm-page first load should be empty)
  if (window.__chartState && window.__chartState.chart) {
    try { window.__chartState.chart.remove(); } catch (e) {}
    window.__chartState = null;
    document.getElementById('chart').innerHTML = '';
  }
  const LC = LightweightCharts, S = p.style, A = S.atr_channel, V = S.vwap, R = S.sr;
  const E50 = S.ema50 || {};
  const cap = document.getElementById('capture');
  cap.style.width = S.width + 'px'; cap.style.height = S.height + 'px'; cap.style.background = S.background || '#0E1117';
  document.body.style.background = S.background || '#0E1117';
  const prec = Math.max(0, Math.min(8, p.digits));
  const fmt = { type: 'price', precision: prec, minMove: Math.pow(10, -prec) };
  const volFrac = (S.volume_pane_pct || 11) / 100;
  const bull = '#00F0FF', bear = '#FF0055';
  const textColor = '#D1D5DB', gridColor = '#1F2937', borderColor = '#374151';
  const chart = LC.createChart(document.getElementById('chart'), {
    width: S.width, height: S.height,
    layout: { background: { type: 'solid', color: S.background || '#0E1117' }, textColor: textColor, fontSize: 11,
              attributionLogo: false },
    grid: { vertLines: { color: gridColor }, horzLines: { color: gridColor } },
    rightPriceScale: { borderColor: borderColor, scaleMargins: { top: 0.12, bottom: volFrac + 0.02 } },
    timeScale: { borderColor: borderColor, timeVisible: true, secondsVisible: false, rightOffset: 0,
                 fixLeftEdge: false, fixRightEdge: false, lockVisibleTimeRangeOnResize: true },
    crosshair: { mode: LC.CrosshairMode.Hidden, vertLine: { visible: false }, horzLine: { visible: false } },
    handleScroll: false, handleScale: false,
  });
  const ov = { lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false, priceFormat: fmt };
  const vol = chart.addSeries(LC.HistogramSeries, { priceScaleId: 'vol', lastValueVisible: false, priceLineVisible: false,
                                                     priceFormat: { type: 'volume' } });
  chart.priceScale('vol').applyOptions({ scaleMargins: { top: 1 - volFrac, bottom: 0 }, visible: false });
  const base = chart.addSeries(LC.LineSeries, { ...ov, color: A.baseline_color, lineWidth: 1, lineStyle: LC.LineStyle.Dashed });
  const up = chart.addSeries(LC.LineSeries, { ...ov, color: A.upper_color, lineWidth: 1, lineStyle: LC.LineStyle.Solid });
  const lo = chart.addSeries(LC.LineSeries, { ...ov, color: A.lower_color, lineWidth: 1, lineStyle: LC.LineStyle.Solid });
  const fill = new BandFill(p.upper, p.lower, rgba(A.fill_color, A.fill_opacity));
  up.attachPrimitive(fill);
  let e50 = null;
  if (p.ema50 && p.ema50.length) {
    e50 = chart.addSeries(LC.LineSeries, {
      ...ov, color: E50.color || '#9CA3AF', lineWidth: E50.width || 1,
      lineStyle: LC.LineStyle.Dashed, priceLineVisible: false
    });
  }
  const vw = chart.addSeries(LC.LineSeries, {
    ...ov, color: V.color || '#FF9800', lineWidth: 2, lineStyle: LC.LineStyle.Solid, priceLineVisible: false
  });
  const cs = chart.addSeries(LC.CandlestickSeries, {
    upColor: bull, downColor: bear, borderUpColor: bull, borderDownColor: bear,
    wickUpColor: bull, wickDownColor: bear, priceFormat: fmt });
  window.__chartState = { chart, vol, base, up, lo, fill, e50, vw, cs, priceLines: [], digits: p.digits };
  _setAllData(window.__chartState, p);
  _applyMeta(p);
  _markRendered(false);
};

// Fast path: reuse series, only setData + S/R refresh
window.updateChart = function (p) {
  window.__rendered = false;
  window.__renderSeq = (window.__renderSeq || 0) + 1;
  if (!window.__chartState) { return window.renderChart(p); }
  _setAllData(window.__chartState, p);
  _applyMeta(p);
  _markRendered(true);
};
</script>
</body>
</html>
